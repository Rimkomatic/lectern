# Tests and build checks. Runs on pull requests, and release.yml calls it before
# anything is published, so a release never skips the tests.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # The same throw-away database and user that docker/test-db.sql makes.
          MYSQL_DATABASE: lectern_test
          MYSQL_USER: lectern_test
          MYSQL_PASSWORD: lectern_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are committed and tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is missing or out of date. Run 'make setup' and commit both files."
            git status --short -- go.mod go.sum
            exit 1
          fi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal e2e)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Tests
        run: go test -p 1 -count=1 ./...
        env:
          LECTERN_TEST_REQUIRE_DB: "1"

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Colour contrast
        run: npm run contrast
      - name: Build
        run: npm run build

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lectern_test
          MYSQL_USER: lectern_test
          MYSQL_PASSWORD: lectern_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg and the Python packages the test needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install playwright pillow reportlab
      # e2e/run.sh builds the web app and the server, then drives the interface
      # with the Chrome that comes with the runner.
      - name: Browser test
        run: ./e2e/run.sh
        env:
          E2E_CHROME: /usr/bin/google-chrome

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The compose setup users run, with the image built from this source:
      # starts, becomes healthy, the administrator logs in, the library is scanned.
      - name: Compose setup
        run: ./e2e/compose-smoke.sh
      - uses: docker/setup-buildx-action@v4
      # What release.yml publishes, minus the push: both platforms must build.
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
