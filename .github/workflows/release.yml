# Publishes the Docker image to GitHub's container registry (ghcr.io).
#
#   push to main      ->  ghcr.io/<owner>/lectern:edge
#   tag v1.2.3        ->  :1.2.3, :1.2, :1 and :latest, plus a GitHub release that
#                         carries the compose file and the settings template
#   tag v1.2.3-rc.1   ->  :1.2.3-rc.1 only, and a pre-release
#
# Images are built for linux/amd64 and linux/arm64. Tests (ci.yml) run first.
# How to make a release: RELEASING.md.
name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: go.sum must be committed
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::go.sum is missing. Run 'make setup' and commit it, so that releases build with the exact dependencies you tested."
            exit 1
          fi

      # Image names must be lower case; the repository name may not be.
      # Docker Hub is optional: it is used only if the repository variable
      # DOCKERHUB_IMAGE (for example "someone/lectern") is set.
      - name: Image names and version
        id: names
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "${DOCKERHUB_IMAGE,,}"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=Lectern
            org.opencontainers.image.description=Self-hosted course server: folders of videos, PDFs and files with per-user progress
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No attestation manifests: they show up as extra "unknown/unknown"
          # platforms on the package page.
          provenance: false
          sbom: false

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # The compose file and settings template go on the release page, so that
      # .../releases/latest/download/docker-compose.yml always works.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release
          cp docker-compose.yml release/docker-compose.yml
          cp .env.example release/env.example
          flags=(--title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/docker-compose.yml release/env.example
